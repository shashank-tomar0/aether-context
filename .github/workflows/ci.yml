name: AETHER CI/CD & Automated Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Backend Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Run Integration & Rubric Test Suite
      run: |
        python tests/test_api.py

    - name: Verify CLI Functionality
      run: |
        python cli/aether.py check "Shiv"
        python cli/aether.py match --size 3

    - name: Build Docker Container
      run: |
        docker build -t aether-context-engine:latest .
